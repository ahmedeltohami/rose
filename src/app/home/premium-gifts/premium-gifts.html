<div class="container">
  <div class="row align-items-start">
    <!-- Left Section -->
    <div class="col-lg-3">
      <img src="images/Frame 19.svg" class="img-fluid" />
    </div>

    <!-- Right Section -->
    <div class="col-lg-9">
      <div class="position-relative">
        <!-- سهم الشمال -->
        <button class="slider-btn left" (click)="prev()"><</button>
        <div class="row g-4">
          @for (product of visibleProducts; track product.id) {
            <div class="col-12 col-md-6 col-lg-4">
              <div class="product-card"
              [routerLink]="['/product',product.id]"
>
                <div class="product-image">
                  <img [src]="product.imgCover" [alt]="product.title" class="img-fluid w-100"/>
                </div>

                <h5>{{ product.title }}</h5>

                <div class="stars">⭐⭐⭐⭐⭐</div>

                <div class="card-footer">
                  <div class="price">
                    <span class="new"> {{ product.priceAfterDiscount }}$ </span>

                    <span class="old"> {{ product.price }}$ </span>
                  </div>

                  <button class="cart-btn">
                    <img src="images/Button - Add To Cart.svg" />
                  </button>
                </div>
              </div>
            </div>
          }
        </div>
        <!-- سهم اليمين -->
        <button class="slider-btn right" (click)="next()">></button>
      </div>
    </div>
  </div>
</div>
